/* =========================================================
   COLLECT DATA
   ========================================================= */

function collect(){

document.querySelectorAll(
"#app input,#app select,#app textarea"
).forEach(el=>{

if(
(el.type==="checkbox" ||
el.type==="radio") &&
!el.checked
){
return;
}

if(!el.name){
return;
}


if(el.type==="checkbox"){

if(!data[el.name]){
data[el.name]=el.value;
}

else{

data[el.name]+=", "+el.value;

}

}

else{

data[el.name]=el.value;

}

});

}


/* =========================================================
   VALIDATION
   ========================================================= */

function valid(){

const err=
document.getElementById("err");

if(err){
err.style.display="none";
}


/* ---------------------------------------------------------
   TEXT INPUTS MARKED REQUIRED
   --------------------------------------------------------- */

const requiredFields=
document.querySelectorAll(
"#app input[required]:not([type=radio]):not([type=checkbox]), #app select[required], #app textarea[required]"
);


for(const el of requiredFields){

if(!String(el.value || "").trim()){

if(err){
err.style.display="block";
}

el.focus();

return false;

}

}


/* ---------------------------------------------------------
   RADIO / CHECKBOX GROUPS
   ONLY GROUPS WITH required=true
   ARE COMPULSORY
   --------------------------------------------------------- */

const requiredGroups={};


document
.querySelectorAll(
"#app input[type=radio][required], #app input[type=checkbox][required]"
)
.forEach(el=>{

requiredGroups[el.name]=true;

});


for(const name in requiredGroups){

const selected=
document.querySelector(
`input[name="${CSS.escape(name)}"]:checked`
);

if(!selected){

if(err){
err.style.display="block";
}

return false;

}

}


return true;

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

if(page===-1){

document.getElementById("app")
.innerHTML=introHTML;

document.getElementById("back")
.style.visibility="hidden";

document.getElementById("next")
.textContent=
"Start Questionnaire / प्रश्नावली शुरू करें";

document.getElementById("bar")
.style.width="0%";

return;

}


const q=questions[page];


document.getElementById("app")
.innerHTML=`

<div class="question">

<h2>
${q.title}
</h2>


<div class="subtitle">

${page===0
?
"Please answer based on your child's usual pattern. / कृपया अपने बच्चे के सामान्य व्यवहार के आधार पर उत्तर दें।"
:
""}

</div>


${q.html}


<div id="err" class="error">

Please answer the required question before continuing.

<br>

कृपया आगे बढ़ने से पहले आवश्यक प्रश्न का उत्तर दें।

</div>

</div>

`;


/* ---------------------------------------------------------
   RESTORE PREVIOUS ANSWERS
   --------------------------------------------------------- */

Object.keys(data).forEach(name=>{

document
.querySelectorAll(
`[name="${CSS.escape(name)}"]`
)
.forEach(el=>{

if(
el.type==="checkbox" ||
el.type==="radio"
){

el.checked=
data[name]
.split(", ")
.includes(el.value);

}

else{

el.value=data[name];

}

});

});


document.getElementById("back")
.style.visibility=
page===0
?
"hidden"
:
"visible";


document.getElementById("next")
.textContent=
page===questions.length-1
?
"Submit / जमा करें"
:
"Next / आगे";


document.getElementById("bar")
.style.width=
((page+1)/questions.length*100)+"%";

}


/* =========================================================
   NEXT
   ========================================================= */

function next(){

if(page===-1){

page=0;

render();

return;

}


if(!valid()){
return;
}


collect();


if(page<questions.length-1){

page++;

render();

}

else{

submitForm();

}

}


/* =========================================================
   PREVIOUS
   ========================================================= */

function prev(){

if(page===-1){
return;
}


collect();


if(page>0){

page--;

render();

}

else{

page=-1;

render();

}

}


/* =========================================================
   SUBMIT
   ========================================================= */

async function submitForm(){

document.getElementById("nav")
.style.display="none";


document.getElementById("app")
.innerHTML=`

<div class="success">

<h1>
Submitting… / जमा किया जा रहा है…
</h1>

<p>
Please wait.
</p>

</div>

`;


/* =========================================================
   TIMESTAMP
   ========================================================= */

const now=new Date();


const months=[
"Jan","Feb","Mar","Apr","May","Jun",
"Jul","Aug","Sep","Oct","Nov","Dec"
];


const day=
String(now.getDate()).padStart(2,"0");


const month=
months[now.getMonth()];


const year=
now.getFullYear();


let hours=
now.getHours();


const minutes=
String(now.getMinutes()).padStart(2,"0");


const ampm=
hours>=12
?
"PM"
:
"AM";


hours=
hours%12 || 12;


const timestamp=
day
+
"-"
+
month
+
"-"
+
year
+
" "
+
String(hours).padStart(2,"0")
+
":"
+
minutes
+
" "
+
ampm;


data.submittedAt=timestamp;


/* =========================================================
   SEND TO GOOGLE SHEETS
   ========================================================= */

try{

await fetch(

SCRIPT_URL,

{

method:"POST",

mode:"no-cors",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:
JSON.stringify(data)

}

);


document.getElementById("app")
.innerHTML=`

<div class="success">

<h1>
Thank you! / धन्यवाद!
</h1>

<p>

Your response has been submitted successfully.

</p>

<p>

आपकी प्रतिक्रिया सफलतापूर्वक जमा हो गई है।

</p>

</div>

`;

}

catch(error){

document.getElementById("app")
.innerHTML=`

<div class="success">

<h1>
Submission completed
</h1>

<p>

If you see this page, please inform the researcher
to verify the response in the spreadsheet.

</p>

</div>

`;

}

}


/* =========================================================
   START
   ========================================================= */

render();

</script>
